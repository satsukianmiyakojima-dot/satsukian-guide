<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さつきあん ゲストガイド</title>
<meta name="theme-color" content="#0E7C86">
<meta name="apple-mobile-web-app-title" content="さつきあん">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FAF8F1;
    --surface:#FFFEFB;
    --surface-2:#EDF4E7;
    --ink:#294333;
    --ink-soft:#647364;
    --line:#E0DCCF;
    --teal:#5C8A63;
    --teal-ink:#376044;
    --coral:#C77B55;
    --coral-ink:#925139;
    --gold:#B88A54;
    --gold-bg:#F7EEDC;
    --green:#5E9368;
    --green-bg:#E9F3E5;
    --shadow: 0 1px 2px rgba(61,54,39,.07), 0 8px 24px -12px rgba(61,54,39,.2);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C2820;
      --surface:#27382B;
      --surface-2:#304633;
      --ink:#F1F1E7;
      --ink-soft:#B9C5B3;
      --line:#465846;
      --teal:#8CAF78;
      --teal-ink:#D4E3C9;
      --coral:#D28A63;
      --coral-ink:#F2C8B2;
      --gold:#D0A66D;
      --gold-bg:#3B3021;
      --green:#93C18A;
      --green-bg:#29402C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C2820;
    --surface:#27382B;
    --surface-2:#304633;
    --ink:#F1F1E7;
    --ink-soft:#B9C5B3;
    --line:#465846;
    --teal:#8CAF78;
    --teal-ink:#D4E3C9;
    --coral:#D28A63;
    --coral-ink:#F2C8B2;
    --gold:#D0A66D;
    --gold-bg:#3B3021;
    --green:#93C18A;
    --green-bg:#29402C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', 'Noto Sans', sans-serif;
    line-height:1.6;
    margin:0;
  }
  body[data-lang="en"]{ font-family:'Noto Sans', sans-serif; }
  body[data-lang="zh"]{ font-family:'Noto Sans TC', sans-serif; }
  body[data-lang="ko"]{ font-family:'Noto Sans KR', sans-serif; }
  h1,h2,h3,.disp{ font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif; text-wrap:balance; }
  body[data-lang="en"] h1, body[data-lang="en"] h2, body[data-lang="en"] h3, body[data-lang="en"] .disp{ font-family:'Noto Sans', sans-serif; font-weight:700; }
  body[data-lang="zh"] h1, body[data-lang="zh"] h2, body[data-lang="zh"] h3, body[data-lang="zh"] .disp{ font-family:'Noto Sans TC', sans-serif; font-weight:700; }
  body[data-lang="ko"] h1, body[data-lang="ko"] h2, body[data-lang="ko"] h3, body[data-lang="ko"] .disp{ font-family:'Noto Sans KR', sans-serif; font-weight:700; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--coral); outline-offset:3px; }
  .minsa{
    height:8px;
    background-image: repeating-linear-gradient(90deg, var(--teal) 0 4px, transparent 4px 8px, var(--coral) 8px 12px, transparent 12px 16px, var(--teal) 16px 20px, transparent 20px 24px, var(--gold) 24px 28px, transparent 28px 32px);
    opacity:.7;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 20px 64px; }
  header.hero{
    padding:20px 20px 26px;
    background: linear-gradient(180deg, var(--surface-2), var(--bg));
  }
  .hero-inner{ max-width:760px; margin:0 auto; }
  /* 外観の写真。スマホ幅(本文350px)で高さ155px。広い画面では同じ比率で大きくなる */
  .hero-photo{
    display:block; width:100%; height:auto; aspect-ratio:350/155; max-height:300px; object-fit:cover;
    border-radius:var(--radius); box-shadow:var(--shadow); background:var(--surface-2); margin-bottom:14px;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--teal-ink); background:var(--surface); border:1px solid var(--line);
    padding:4px 10px; border-radius:999px; margin-bottom:14px;
  }
  h1.title{ font-size:clamp(28px,6vw,38px); margin:0 0 6px; color:var(--ink); }
  p.tagline{ margin:0 0 20px; color:var(--ink-soft); font-size:16px; max-width:52ch; }
  .langbar{ display:flex; flex-wrap:wrap; gap:8px; }
  .langbtn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:7px 14px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500;
  }
  .langbtn[aria-pressed="true"]{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .roombar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; }
  .roombar .rlabel{ font-size:13px; color:var(--ink-soft); margin-right:2px; }
  .roombtn{
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    padding:7px 14px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .roombtn[aria-pressed="true"]{ background:var(--coral); border-color:var(--coral); color:#fff; }

  nav.tabs{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:10px 20px;
  }
  .tabs-inner{
    max-width:760px; margin:0 auto;
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  }
  .tabs-inner::-webkit-scrollbar{ display:none; }
  .tabbtn{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    border:1px solid transparent; background:transparent; color:var(--ink-soft);
    padding:9px 14px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:500;
    white-space:nowrap;
  }
  .tabbtn svg{ width:17px; height:17px; flex:none; }
  .tabbtn[aria-selected="true"]{ background:var(--surface); border-color:var(--line); color:var(--teal-ink); box-shadow:var(--shadow); }

  main{ padding-top:28px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow);
  }
  .card + .card{ margin-top:16px; }
  section.panel h2{ font-size:22px; margin:0 0 4px; display:flex; align-items:center; gap:10px; }
  section.panel h2 svg{ width:22px; height:22px; color:var(--teal); flex:none; }
  section.panel p.lead{ color:var(--ink-soft); margin:0 0 20px; }

  .roomgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:6px; }
  .roomcard{
    text-align:left; cursor:pointer; border:1.5px solid var(--line); background:var(--surface);
    border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px;
  }
  .roomcard[aria-pressed="true"]{ border-color:var(--teal); box-shadow:0 0 0 3px color-mix(in srgb, var(--teal) 18%, transparent); }
  .roomcard .rname{ font-weight:700; font-size:17px; font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif; }
  body[data-lang="en"] .roomcard .rname{ font-family:'Noto Sans',sans-serif; }
  body[data-lang="zh"] .roomcard .rname{ font-family:'Noto Sans TC',sans-serif; }
  body[data-lang="ko"] .roomcard .rname{ font-family:'Noto Sans KR',sans-serif; }
  .badgerow{ display:flex; flex-wrap:wrap; gap:6px; }
  .badge{ font-size:12px; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); }
  .badge.cap{ background:var(--gold-bg); color:var(--gold); font-weight:600; }
  .roomcard .rdesc{ font-size:13.5px; color:var(--ink-soft); margin:0; }

  .selectedroom-note{
    display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--teal-ink);
    background:var(--green-bg); border-radius:10px; padding:8px 12px; margin:14px 0 0;
  }
  .selectedroom-note svg{ width:16px; height:16px; color:var(--green); flex:none; }

  .factgrid{ display:grid; grid-template-columns:1fr; gap:0; margin-top:18px; border-top:1px solid var(--line); }
  .fact{ display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
  .fact svg{ width:19px; height:19px; color:var(--teal); flex:none; margin-top:2px; }
  .fact .flabel{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  .fact .fval{ font-size:15px; }
  .fact a.maplink{ font-size:13px; color:var(--teal-ink); text-decoration:underline; display:inline-block; margin-top:3px; }
  .fact a.phone-link{ color:var(--ink); text-decoration:none; }
  .fact a.phone-link:hover{ color:var(--teal-ink); text-decoration:underline; }

  ul.featlist{ list-style:none; margin:16px 0 0; padding:0; display:grid; gap:9px; }
  ul.featlist li{ display:flex; gap:10px; align-items:flex-start; font-size:14.5px; }
  ul.featlist li svg{ width:17px; height:17px; color:var(--coral); flex:none; margin-top:2px; }

  .ruleitem{ border-bottom:1px solid var(--line); padding:16px 0; }
  .ruleitem:last-child{ border-bottom:none; }
  .ruleitem h3{ font-size:16px; margin:0 0 8px; display:flex; gap:10px; align-items:baseline; }
  .ruleitem .rnum{ color:var(--coral); font-family:'Zen Maru Gothic',sans-serif; font-size:15px; }
  .ruleitem ul{ margin:0; padding-left:20px; display:grid; gap:6px; }
  .ruleitem li{ font-size:14.5px; color:var(--ink); }
  .ruleitem.emergency{ background:var(--gold-bg); margin:0 -22px; padding:16px 22px; border-bottom:none; }

  .wifiblock{ border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:14px; }
  .wifiblock h3{ font-size:14px; margin:0 0 10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .wifirow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .wifirow:last-child{ border-bottom:none; }
  .wifirow .wlabel{ font-size:12px; color:var(--ink-soft); }
  .wifirow .wval{ font-family:ui-monospace,'SFMono-Regular',Consolas,monospace; font-size:14.5px; letter-spacing:.02em; }
  .wifirow .wactions{ display:flex; gap:6px; }
  .iconbtn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    border-radius:8px; padding:6px 9px; cursor:pointer; font-size:12px; display:flex; align-items:center; gap:5px;
  }
  .iconbtn:hover{ border-color:var(--teal); color:var(--teal-ink); }
  .iconbtn svg{ width:14px; height:14px; }
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:20;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .searchbox{
    display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:18px; background:var(--surface-2);
  }
  .searchbox svg{ width:18px; height:18px; color:var(--ink-soft); flex:none; }
  .searchbox input{ border:none; background:transparent; outline:none; font-size:15px; width:100%; color:var(--ink); font-family:inherit; }

  details.faqitem{ border:1px solid var(--line); border-radius:12px; padding:0; margin-bottom:9px; overflow:hidden; }
  details.faqitem summary{
    list-style:none; cursor:pointer; padding:13px 16px; display:flex; justify-content:space-between; gap:10px;
    font-weight:500; font-size:15px; align-items:center;
  }
  details.faqitem summary::-webkit-details-marker{ display:none; }
  details.faqitem summary .chev{ width:16px; height:16px; color:var(--ink-soft); flex:none; transition:transform .15s ease; }
  details.faqitem[open] summary .chev{ transform:rotate(180deg); }
  details.faqitem .faqans{ padding:0 16px 15px; color:var(--ink-soft); font-size:14.5px; }
  .faq-empty{ text-align:center; padding:28px 10px; color:var(--ink-soft); }
  .faq-empty svg{ width:34px; height:34px; color:var(--line); margin-bottom:10px; }

  .ctarow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; border-radius:12px; padding:11px 18px; font-size:14.5px;
    font-weight:600; cursor:pointer; border:1px solid transparent; text-decoration:none;
  }
  .btn svg{ width:17px; height:17px; }
  .btn.primary{ background:var(--coral); color:#fff; }
  .btn.ghost{ background:var(--surface); border-color:var(--line); color:var(--ink); }

  .contactcard{ display:flex; flex-direction:column; gap:14px; }
  .contactrow{ display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .contactrow:last-child{ border:none; }
  .contactrow svg{ width:19px; height:19px; color:var(--teal); flex:none; margin-top:2px; }
  .contactrow .clabel{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .contactrow .cval{ font-size:15px; }
  .emerg-box{ background:var(--gold-bg); border-radius:12px; padding:14px 16px; font-size:14px; color:var(--ink); display:flex; gap:10px; }
  .emerg-box svg{ width:18px; height:18px; color:var(--gold); flex:none; margin-top:1px; }
  .consent-card{ max-width:620px; margin:0 auto; }
  .consent-list{ list-style:none; padding:0; margin:18px 0 0; display:grid; gap:10px; }
  .consent-item{ display:flex; align-items:flex-start; gap:10px; padding:12px; border:1px solid var(--line); border-radius:12px; }
  .consent-item input{ width:19px; height:19px; flex:none; margin:2px 0 0; accent-color:var(--teal); }
  .consent-item label{ font-size:14.5px; cursor:pointer; }
  .consent-actions{ margin-top:20px; }
  .consent-actions .btn{ width:100%; justify-content:center; }
  .consent-actions .btn:disabled{ cursor:not-allowed; opacity:.45; }
  .consent-note{ margin:12px 0 0; color:var(--ink-soft); font-size:12.5px; text-align:center; }
  .language-card{ max-width:620px; margin:0 auto; text-align:center; }
  .language-card h2{ justify-content:center; }
  .language-options{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:22px; }
  .language-option{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; padding:13px 12px; cursor:pointer; font-size:15px; font-weight:600; }
  .language-option:hover{ border-color:var(--teal); color:var(--teal-ink); }

  @media (max-width:520px){
    .wifirow{ align-items:flex-start; flex-direction:column; }
    .wifirow .wactions{ width:100%; }
    .wifirow .wactions .iconbtn{ flex:1; justify-content:center; min-height:40px; }
  }

  footer{ text-align:center; padding:28px 20px 48px; color:var(--ink-soft); font-size:12.5px; }
  footer .fname{ font-family:'Zen Maru Gothic',sans-serif; color:var(--teal-ink); font-weight:700; }

  .passbanner{ display:flex; align-items:center; justify-content:space-between; gap:8px 14px; flex-wrap:wrap; background:var(--green-bg); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:0 0 16px; font-size:14px; }
  .passbanner .pl{ display:flex; align-items:center; gap:8px; font-weight:700; color:var(--teal-ink); }
  .passbanner svg{ width:18px; height:18px; color:var(--green); flex:none; }
  .passbanner .pd{ color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .shopfilters{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
  .shopfilter{ border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:500; cursor:pointer; }
  .shopfilter[aria-pressed="true"]{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .shoplist{ display:grid; gap:16px; }
  .shopcard{ border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface); }
  .shopphoto img{ display:block; width:100%; height:auto; max-height:260px; object-fit:cover; }
  .shopbody{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  .shopname{ font-size:19px; margin:0; }
  .shoptag{ margin:0; color:var(--ink-soft); font-size:14px; }
  .offerbox{ border:1.5px dashed var(--coral); border-radius:14px; padding:14px; background:color-mix(in srgb, var(--coral) 6%, var(--surface)); display:flex; flex-direction:column; gap:8px; }
  .offertitle{ display:flex; align-items:center; gap:8px; font-weight:700; color:var(--coral-ink); font-size:15.5px; }
  .offertitle svg{ width:18px; height:18px; color:var(--coral); flex:none; }
  .offerpoints{ margin:0; padding-left:20px; display:grid; gap:4px; font-size:14px; }
  .pricetable{ border-top:1px solid var(--line); }
  .pricerow{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .pricerow .pv{ font-weight:700; font-variant-numeric:tabular-nums; }
  .offernote{ margin:0; font-size:13px; color:var(--ink-soft); }
  .redeem{ margin:0; font-size:14px; font-weight:700; color:var(--teal-ink); }
  .shopfoot{ margin:16px 0 0; color:var(--ink-soft); font-size:12.5px; }
  .shopbody .factgrid{ margin-top:0; }
  .coupon{ position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:0 18px 32px; }
  .coupon-bar{ align-self:stretch; height:8px; margin:0 -18px 14px; background-image:repeating-linear-gradient(90deg, var(--teal) 0 4px, transparent 4px 8px, var(--coral) 8px 12px, transparent 12px 16px, var(--teal) 16px 20px, transparent 20px 24px, var(--gold) 24px 28px, transparent 28px 32px); opacity:.7; flex:none; }
  .coupon-close{ align-self:flex-end; margin-bottom:6px; }
  .coupon-pass{ display:inline-flex; align-items:center; gap:8px; background:var(--teal); color:#fff; border-radius:999px; padding:9px 20px; font-weight:700; font-size:17px; }
  .coupon-pass svg{ width:20px; height:20px; }
  .coupon-date{ font-size:clamp(24px,7.5vw,36px); font-weight:700; margin:16px 0 0; text-align:center; text-wrap:balance; }
  .coupon-time{ font-size:32px; font-weight:700; color:var(--coral-ink); font-variant-numeric:tabular-nums; margin:2px 0 14px; }
  .coupon-card{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:12px; }
  .coupon-shop{ font-size:22px; margin:0; }
  .coupon-hint{ max-width:520px; margin:14px 0 0; color:var(--ink-soft); font-size:13px; text-align:center; }
  .coupon-stay{ font-weight:700; color:var(--teal-ink); margin:-6px 0 12px; }
  .stayform{ display:grid; gap:14px; }
  .stayfield{ display:grid; gap:6px; }
  .stayfield label{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .stayfield input[type="date"]{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font:inherit; font-size:16px; }
  /* iPhoneのSafariで日付欄の幅・高さが崩れないように */
  .stayfield input[type="date"]{ display:block; min-height:50px; -webkit-appearance:none; appearance:none; text-align:left; }
  .stayfield input[type="date"]::-webkit-date-and-time-value{ text-align:left; }
  .stayfield input:disabled{ opacity:.6; }
  .stayerror{ margin:0; padding:10px 12px; border-radius:10px; background:var(--gold-bg); color:var(--coral-ink); font-size:14px; font-weight:600; }
  .staynote{ margin:0; color:var(--ink-soft); font-size:12.5px; }
  .stayactions{ display:flex; gap:10px; flex-wrap:wrap; }
  .stayactions .btn.primary{ flex:1; justify-content:center; }
  .lockbox{ border:1.5px dashed var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .lockbox .lockperiod{ font-weight:700; color:var(--teal-ink); }
  .lockbox p{ margin:0; font-size:14.5px; }
  .lockbox svg{ width:17px; height:17px; vertical-align:-3px; }
  .a2hs{ border:1.5px solid var(--teal); border-radius:14px; background:color-mix(in srgb, var(--teal) 6%, var(--surface)); margin:0 0 18px; }
  .a2hs summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:13px 14px; font-weight:700; color:var(--teal-ink); font-size:14.5px; }
  .a2hs summary::-webkit-details-marker{ display:none; }
  .a2hs summary svg{ width:20px; height:20px; flex:none; color:var(--teal); }

    items:[
      {t:"Check-in / Check-out", li:["Check-in from 3:00 PM, check-out by 10:00 AM.","Please contact us in advance to change these times.","A late fee of ¥1,000 per hour applies after 10:00 AM."]},
      {t:"No smoking", li:["Smoking is not permitted indoors."]},

      {t:"Sorting & disposing of trash", li:["PET bottle labels and caps are burnable trash.","Please use the designated trash bags.","Do not leave trash indoors — take it to the on-site trash area."]},

const STAY_MAX_NIGHTS = 14;
const STAY_COOLDOWN_DAYS = 30;
const OFFICIAL_URL = 'https://www.satsuki-gp.com/satsukian';
function todayJst(){ return new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Tokyo'}); }
function isoToUtc(iso){ return Date.parse(iso + 'T00:00:00Z'); }
function addDays(iso, n){ return new Date(isoToUtc(iso) + n*86400000).toISOString().slice(0,10); }
function diffDays(a, b){ return Math.round((isoToUtc(b) - isoToUtc(a)) / 86400000); }
function validIso(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(isoToUtc(s)); }

let state = { lang: 'ja', languageSelected: false, room: null, tab: 'guide', faqQuery: '', consentAccepted: false, shopFilter: 'all', coupon: null, stay: null, editingStay: false, stayDraft: null };
try{
  const savedLang = localStorage.getItem('sk_lang');
  const savedLanguageSelected = localStorage.getItem('sk_lang_confirmed');
  const savedRoom = localStorage.getItem('sk_room');
  const savedTab = localStorage.getItem('sk_tab');
  const savedConsent = localStorage.getItem('sk_consent');
  if(savedLang && T[savedLang]) state.lang = savedLang;
  if(savedLanguageSelected === '1') state.languageSelected = true;
  if(savedRoom && WIFI[savedRoom]) state.room = savedRoom;
  if(savedTab && ['guide','rules','bbq','wifi','shops','faq','contact'].includes(savedTab)) state.tab = savedTab;
  if(savedConsent === '1') state.consentAccepted = true;
  const savedStay = localStorage.getItem('sk_stay');
  if(savedStay){
    const o = JSON.parse(savedStay);
    if(o && validIso(o.in) && validIso(o.out) && o.out > o.in) state.stay = {in:o.in, out:o.out};
  }
}catch(e){}
state.languageSelected = Boolean(state.languageSelected);
state.consentAccepted = state.languageSelected && Boolean(state.consentAccepted);

function save(){
  try{
    localStorage.setItem('sk_lang', state.lang);
    localStorage.setItem('sk_lang_confirmed', state.languageSelected ? '1' : '0');
    localStorage.setItem('sk_tab', state.tab);
    localStorage.setItem('sk_consent', state.consentAccepted ? '1' : '0');
    if(state.room) localStorage.setItem('sk_room', state.room); else localStorage.removeItem('sk_room');
    if(state.stay) localStorage.setItem('sk_stay', JSON.stringify(state.stay));
  }catch(e){}
}
function t(){ return T[state.lang]; }

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> el.classList.remove('show'), 1600);
}
window.skCopy = function(text){
  const done = ()=> showToast(t().wifi.copied);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
};
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
window.skToggleMask = function(id){
  const el = document.getElementById(id);
  const btn = document.getElementById(id+'-btn');
  const isMasked = el.dataset.masked === '1';
  if(isMasked){ el.textContent = el.dataset.value; el.dataset.masked='0'; btn.innerHTML = ICON.eyeoff + '<span>'+t().wifi.hide+'</span>'; }
  else { el.textContent = '••••••••••••'; el.dataset.masked='1'; btn.innerHTML = ICON.eye + '<span>'+t().wifi.show+'</span>'; }
};
window.skSetLang = function(l){ state.lang = l; state.languageSelected = true; save(); render(); };
window.skSetTab = function(tab){ state.tab = tab; save(); render(); window.scrollTo({top:0, behavior:'instant'}); };
window.skSetRoom = function(r){ state.room = r; save(); render(); };
window.skSetQuery = function(v){ state.faqQuery = v; renderContent(); };
window.skAcceptConsent = function(){
  const checks = Array.from(document.querySelectorAll('[data-action="consentCheck"]'));
  if(checks.some(check => !check.checked)){ showToast(t().consent.required); return; }
  state.consentAccepted = true;
  save();
  render();
  window.scrollTo({top:0, behavior:'instant'});
};
function stayStatus(){
  const s = state.stay;
  if(!s) return 'none';
  const today = todayJst();
  if(today < s.in) return 'notyet';
  if(today > s.out) return 'expired';
  return 'active';
}
function canStartNew(){ return !state.stay || todayJst() >= addDays(state.stay.out, STAY_COOLDOWN_DAYS); }
function fmtMD(iso){ return new Date(isoToUtc(iso)).toLocaleDateString(LOCALES[state.lang], {timeZone:'UTC', month:'numeric', day:'numeric'}); }
// チェックアウト日の選べる範囲(チェックインの翌日以降・今日以降、最大14泊まで)
function stayOutRange(inD){
  const today = todayJst();
  const next = addDays(inD, 1);
  return { min: next > today ? next : today, max: addDays(inD, STAY_MAX_NIGHTS) };
}
function stayRangeText(){ return state.stay ? fmtMD(state.stay.in) + '〜' + fmtMD(state.stay.out) : ''; }
function validateStay(inD, outD){
  if(!inD || !outD) return 'errRequired';
  if(outD <= inD) return 'errOrder';
  if(diffDays(inD, outD) > STAY_MAX_NIGHTS) return 'errLength';
  const today = todayJst();
  if(inD < addDays(today, -(STAY_MAX_NIGHTS - 1)) || inD > addDays(today, 1)) return 'errCheckin';
  if(outD < today) return 'errPast';
  return '';
}
window.skSubmitStay = function(){
  const prev = state.stay;
  const st = stayStatus();
  let inD = document.getElementById('stayIn').value;
  const outD = document.getElementById('stayOut').value;
  if(prev && st === 'active') inD = prev.in;
  let err = validateStay(inD, outD);
  if(!err && prev && st === 'expired' && !canStartNew()) err = 'errCooldown';
  if(err){
    const box = document.getElementById('stayError');
    box.textContent = t().stay[err];
    box.hidden = false;
    return;
  }
  if(prev && st === 'expired'){ state.consentAccepted = false; state.room = null; }
  state.stay = {in:inD, out:outD};
  state.editingStay = false;
  state.stayDraft = null;
  save();
  render();
  window.scrollTo({top:0, behavior:'instant'});
};
function updateConsentButton(){
  const button = document.getElementById('consentAcceptButton');
  if(button) button.disabled = !Array.from(document.querySelectorAll('[data-action="consentCheck"]')).every(check => check.checked);
}

// Delegated event handling — attribute handlers like onclick="" can be blocked
// by the artifact's CSP, so every interactive element is wired through this
// single document-level listener instead.
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action === 'setLang') skSetLang(el.dataset.lang);
  else if(action === 'setTab') skSetTab(el.dataset.tab);
  else if(action === 'setRoom') skSetRoom(el.dataset.room);
  else if(action === 'toggleMask') skToggleMask(el.dataset.target);
  else if(action === 'copy') skCopy(el.dataset.value);
  else if(action === 'acceptConsent') skAcceptConsent();
  else if(action === 'filterShops'){ state.shopFilter = el.dataset.cat; renderContent(); }
  else if(action === 'openCoupon'){ if(stayStatus() === 'active'){ state.coupon = el.dataset.shop; renderCoupon(); } }
  else if(action === 'submitStay') skSubmitStay();
  else if(action === 'editStay' || action === 'newStay'){ state.editingStay = true; state.stayDraft = null; render(); }
  else if(action === 'cancelStay'){ state.editingStay = false; state.stayDraft = null; render(); }
  else if(action === 'closeCoupon'){ state.coupon = null; renderCoupon(); }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && state.coupon){ state.coupon = null; renderCoupon(); }
});
document.addEventListener('change', function(e){
  if(e.target && e.target.matches('[data-action="consentCheck"]')) updateConsentButton();
});
// 入力途中の宿泊期間を覚えておく(言語の切り替えやアプリの切り替えで消えないように)。
// チェックイン日を変えたら、チェックアウト日の選べる範囲も合わせる。
function onStayInput(e){
  const inEl = document.getElementById('stayIn');
  const outEl = document.getElementById('stayOut');
  if(!inEl || !outEl) return;
  if(e.target === inEl && validIso(inEl.value)){
    const r = stayOutRange(inEl.value);
    outEl.min = r.min; outEl.max = r.max;
    if(!validIso(outEl.value) || outEl.value < r.min) outEl.value = addDays(inEl.value, 1);
    else if(outEl.value > r.max) outEl.value = r.max;
  }
  state.stayDraft = {in:inEl.value, out:outEl.value};
  const box = document.getElementById('stayError');
  if(box) box.hidden = true;
}
document.addEventListener('change', function(e){
  if(e.target && (e.target.id === 'stayIn' || e.target.id === 'stayOut')) onStayInput(e);
});
document.addEventListener('input', function(e){
  if(e.target && (e.target.id === 'stayIn' || e.target.id === 'stayOut')){ onStayInput(e); return; }
  if(e.target && e.target.id === 'faqSearchInput'){
    const pos = e.target.selectionStart;
    skSetQuery(e.target.value);
    const fresh = document.getElementById('faqSearchInput');
    if(fresh){ fresh.focus(); try{ fresh.setSelectionRange(pos, pos); }catch(err){} }
  }
});

function renderLangbar(){
  const bar = document.getElementById('langbar');
  bar.innerHTML = Object.keys(T).map(l =>
    '<button class="langbtn" data-action="setLang" data-lang="'+l+'" aria-pressed="'+(l===state.lang)+'">'+T[l].langName+'</button>'
  ).join('');
}
function guideVisible(){ return state.languageSelected && Boolean(state.stay) && !state.editingStay && state.consentAccepted; }
function renderRoombar(){
  const bar = document.getElementById('roombar');
  bar.hidden = !guideVisible();
  bar.innerHTML = '<span class="rlabel">'+t().roomSelect+'</span>' + ['102','201','202'].map(id =>
    '<button class="roombtn" data-action="setRoom" data-room="'+id+'" aria-pressed="'+(state.room===id)+'">'+t().rooms[id].name+'</button>'
  ).join('');
}
function renderTabbar(){
  const bar = document.getElementById('tabbar');
  const tabs = [['guide','home'],['rules','clipboard'],['bbq','grill'],['wifi','wifi'],['shops','tag'],['faq','faq'],['contact','mail']];
  bar.innerHTML = tabs.map(([key,icon]) =>
    '<button class="tabbtn" data-action="setTab" data-tab="'+key+'" aria-selected="'+(key===state.tab)+'">'+ICON[icon]+'<span>'+t().nav[key]+'</span></button>'
  ).join('');
}

function roomCardHtml(id){
  const r = t().rooms[id];
  return '<button type="button" class="roomcard" data-action="setRoom" data-room="'+id+'" aria-pressed="'+(state.room===id)+'">'
    + '<div class="rname">'+r.name+'</div>'
    + '<div class="badgerow"><span class="badge cap">'+r.cap+'</span>'+r.badges.map(b=>'<span class="badge">'+b+'</span>').join('')+'</div>'
    + '<p class="rdesc">'+r.desc+'</p>'
    + '</button>';
}

function panelLanguage(){
  return '<section class="panel"><div class="card language-card">'
    + '<h2>'+ICON.spark+'言語 / Language</h2>'
    + '<p class="lead">ご利用の言語を選択してください<br>Select your language</p>'
    + '<div class="language-options">'+Object.keys(T).map(l=>'<button type="button" class="language-option" data-action="setLang" data-lang="'+l+'">'+T[l].langName+'</button>').join('')+'</div>'
    + '</div></section>';
}

function panelStay(){
  const s = t().stay;
  const prev = state.stay;
  const st = stayStatus();
  const fresh = !prev || st === 'expired';
  const today = todayJst();
  const lockIn = prev && st === 'active';
  const draft = state.stayDraft;
  let defIn = fresh ? today : prev.in;
  let defOut = fresh ? addDays(today, 1) : prev.out;
  if(draft){
    if(!lockIn && draft.in) defIn = draft.in;
    if(draft.out) defOut = draft.out;
  }
  const inMin = addDays(today, -(STAY_MAX_NIGHTS - 1));
  const inMax = addDays(today, 1);
  const outR = stayOutRange(validIso(defIn) ? defIn : today);
  return '<section class="panel"><div class="card consent-card">'
    + '<h2>'+ICON.clock+s.title+'</h2>'
    + '<p class="lead">'+s.lead+'</p>'
    + '<div class="stayform">'
      + '<div class="stayfield"><label for="stayIn">'+s.checkin+'</label><input type="date" id="stayIn" value="'+defIn+'"'+(lockIn ? ' disabled' : ' min="'+inMin+'" max="'+inMax+'"')+'></div>'
      + '<div class="stayfield"><label for="stayOut">'+s.checkout+'</label><input type="date" id="stayOut" value="'+defOut+'" min="'+outR.min+'" max="'+outR.max+'"></div>'
      + '<p class="stayerror" id="stayError" role="alert" hidden></p>'
      + '<p class="staynote">'+s.note+'</p>'
      + '<div class="stayactions"><button type="button" class="btn primary" data-action="submitStay">'+ICON.check+(fresh ? s.go : s.save)+'</button>'
      + (prev ? '<button type="button" class="btn ghost" data-action="cancelStay">'+s.cancel+'</button>' : '')
      + '</div>'
    + '</div></div></section>';
}

function lockedPanel(icon, title){
  const s = t().stay;
  const st = stayStatus();
  const msg = st === 'notyet' ? s.notyet : s.expired;
  let actions;
  if(st !== 'expired'){
    actions = '<button type="button" class="btn ghost" data-action="editStay">'+s.change+'</button>';
  } else {
    actions = '<a class="btn ghost" href="'+OFFICIAL_URL+'" target="_blank" rel="noopener">'+s.official+'</a>'
      + (canStartNew() ? '<button type="button" class="btn ghost" data-action="newStay">'+s.newStay+'</button>' : '');
  }
  return '<section class="panel"><div class="card">'
    + '<h2>'+icon+title+'</h2>'
    + '<p class="lead">'+s.lockedLead+'</p>'
    + '<div class="lockbox">'
      + '<div class="lockperiod">'+ICON.lock+' '+s.label+' '+stayRangeText()+'</div>'
      + '<p>'+msg+'</p>'
      + (st === 'expired' && !canStartNew() ? '<p style="color:var(--ink-soft);font-size:13.5px;">'+s.ask+'</p>' : '')
      + '<div class="ctarow" style="margin-top:4px;">'+actions+'</div>'
    + '</div></div></section>';
}

function panelConsent(){
  const c = t().consent;
  return '<section class="panel"><div class="card consent-card">'
    + '<h2>'+ICON.clipboard+c.title+'</h2>'
    + '<p class="lead">'+c.lead+'</p>'
    + '<div class="consent-list">'+c.items.map((item,i)=>'<div class="consent-item"><input type="checkbox" id="consent-'+i+'" data-action="consentCheck"><label for="consent-'+i+'">'+item+'</label></div>').join('')+'</div>'
    + '<div class="consent-actions"><button type="button" class="btn primary" id="consentAcceptButton" data-action="acceptConsent" disabled>'+ICON.check+c.agree+'</button></div>'
    + '<p class="consent-note">'+c.required+'</p>'
    + '</div></section>';
}

function a2hsHtml(){
  const a = t().a2hs;
  const steps = arr => '<ol>'+arr.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
  return '<details class="a2hs"><summary>'+ICON.mobile+'<span>'+a.title+'</span>'+ICON.chev+'</summary>'
    + '<div class="a2hs-body"><p>'+a.lead+'</p>'
    + '<div class="a2hs-cols"><div><h4>'+a.ios+'</h4>'+steps(a.iosSteps)+'</div><div><h4>'+a.android+'</h4>'+steps(a.androidSteps)+'</div></div>'
    + '<p class="a2hs-note">'+a.note+'</p></div></details>';
}

function panelGuide(){
  const g = t().guide;
  return '<section class="panel"><div class="card">'
    + '<h2>'+ICON.home+g_nav('guide')+'</h2>'
    + '<p class="lead">'+g.intro+'</p>'
    + a2hsHtml()
    + '<ul class="featlist">'+g.features.map(f=>'<li>'+ICON.spark+'<span>'+f+'</span></li>').join('')+'</ul>'
    + '<div class="factgrid">'
      + fact('pin', g.addressLabel, ADDRESS_RAW, '<a class="maplink" href="'+MAP_URL+'" target="_blank" rel="noopener">'+g.maplink+' →</a>')
      + fact('clock', g.checkinLabel, g.checkin)
      + fact('clock', g.checkoutLabel, g.checkout)
      + fact('phone', g.phoneLabel, '<a class="phone-link" href="tel:'+PHONE_MAIN.replace(/-/g,'')+'">'+PHONE_MAIN+'</a>')
    + '</div>'
    + '</div>'
    + '<figure class="guidefig"><img src="'+GUIDE_PHOTOS.view+'" alt="'+t().photos.viewAlt+'" width="800" height="533" loading="lazy" decoding="async"><figcaption>'+t().photos.viewCaption+'</figcaption></figure>'
    + '</section>';
}
function g_nav(key){ return t().nav[key]; }
function fact(icon,label,val,extra){
  return '<div class="fact">'+ICON[icon]+'<div><div class="flabel">'+label+'</div><div class="fval">'+val+'</div>'+(extra||'')+'</div></div>';
}

function panelRules(){
  const r = t().rules;
  return '<section class="panel"><div class="card">'
    + '<h2>'+ICON.clipboard+r.title+'</h2>'
    + '<p class="lead">'+r.lead+'</p>'
    + r.items.map((it,i)=>'<div class="ruleitem'+(it.emergency?' emergency':'')+'"><h3><span class="rnum">'+(i+1)+'</span>'+it.t+'</h3><ul>'+it.li.map(l=>'<li>'+l+'</li>').join('')+'</ul></div>').join('')
    + '</div></section>';
}

function panelBbq(){
  const b = t().bbq;
  return '<section class="panel"><div class="card">'
    + '<h2>'+ICON.grill+b.title+'</h2>'
    + '<p class="lead">'+b.lead+'</p>'
    + '<div class="factgrid" style="margin-top:0;">'+b.overview.map(o=>'<div class="fact">'+ICON.check+'<div><div class="flabel">'+o[0]+'</div><div class="fval">'+o[1]+'</div></div></div>').join('')+'</div>'
    + '<div class="ruleitem"><h3>'+b.lendTitle+'</h3><p style="margin:0;font-size:14.5px;">'+b.lend+'</p></div>'
    + '<div class="ruleitem"><h3>'+b.bringTitle+'</h3><p style="margin:0;font-size:14.5px;">'+b.bring+'</p></div>'
    + '<div class="ruleitem"><h3>'+b.afterTitle+'</h3><ol style="margin:0;padding-left:20px;display:grid;gap:6px;">'+b.after.map(a=>'<li style="font-size:14.5px;">'+a+'</li>').join('')+'</ol></div>'
    + '<div class="ruleitem emergency"><h3>'+b.noteTitle+'</h3><ul>'+b.notes.map(n=>'<li>'+n+'</li>').join('')+'</ul></div>'
    + '<p style="margin:16px 0 0;color:var(--ink-soft);font-size:14px;">'+b.footer+'</p>'
    + '</div></section>';
}

const LOCALES = {ja:'ja-JP', en:'en-US', zh:'zh-TW', ko:'ko-KR'};
function L(o){ return o ? (o[state.lang] || o.ja || '') : ''; }
function fmtDate(){ return new Date().toLocaleDateString(LOCALES[state.lang], {timeZone:'Asia/Tokyo', year:'numeric', month:'long', day:'numeric', weekday:'short'}); }
function fmtTime(){ return new Date().toLocaleTimeString(LOCALES[state.lang], {timeZone:'Asia/Tokyo', hour:'2-digit', minute:'2-digit', second:'2-digit'}); }

function offerHtml(s){
  const u = t().shops;
  const pts = (s.points && L(s.points)) || [];
  const rows = s.prices ? s.prices.rows.map(r=>'<div class="pricerow"><span>'+L(r.label)+'</span><span class="pv">'+L(r.value)+'</span></div>').join('') : '';
  return '<div class="offertitle">'+ICON.tag+L(s.offerTitle)+'</div>'
    + (pts.length ? '<ul class="offerpoints">'+pts.map(p=>'<li>'+p+'</li>').join('')+'</ul>' : '')
    + (rows ? '<div class="pricetable">'+rows+'</div>' : '')
    + (s.prices && s.prices.note ? '<p class="offernote">'+L(s.prices.note)+'</p>' : '')
    + (s.note ? '<p class="offernote">'+L(s.note)+'</p>' : '')
    + (s.redeem ? '<p class="redeem">'+L(s.redeem)+'</p>' : '');
}

function shopCardHtml(s){
  const u = t().shops;
  const photo = SHOP_PHOTOS[s.photo];
  const mapLink = s.map ? '<a class="maplink" href="'+s.map+'" target="_blank" rel="noopener">'+u.map+' →</a>' : '';
  const facts = [];
  if(s.hours) facts.push(fact('clock', u.hours, L(s.hours)));
  if(s.closed) facts.push(fact('clock', u.closed, L(s.closed)));
  if(s.distance) facts.push(fact('pin', u.distance, L(s.distance), mapLink));
  else if(s.map) facts.push(fact('pin', u.map, '', mapLink));
  if(s.phone) facts.push(fact('phone', u.phone,'<a class="phone-link" href="tel:'+s.phone.replace(/-/g,'')+'">'+s.phone+'</a>'));
  const btns = [];
  if(s.line) btns.push('<a class="btn ghost" href="'+s.line+'" target="_blank" rel="noopener">'+u.line+'</a>');
  if(s.web) btns.push('<a class="btn ghost" href="'+s.web+'" target="_blank" rel="noopener">'+u.web+'</a>');
  btns.push('<button type="button" class="btn primary" data-action="openCoupon" data-shop="'+s.id+'">'+ICON.check+u.show+'</button>');
  return '<article class="shopcard">'
    + (photo ? '<div class="shopphoto"><img src="'+photo+'" alt="'+L(s.name).replace(/"/g,'&quot;')+'"></div>' : '')
    + '<div class="shopbody">'
      + '<div class="badgerow"><span class="badge cap">'+u.only+'</span><span class="badge">'+u.cats[s.cat]+'</span></div>'
      + '<h3 class="shopname">'+L(s.name)+'</h3>'
      + (s.tagline ? '<p class="shoptag">'+L(s.tagline)+'</p>' : '')
      + '<div class="offerbox">'+offerHtml(s)+'</div>'
      + (facts.length ? '<div class="factgrid">'+facts.join('')+'</div>' : '')
      + '<div class="ctarow">'+btns.join('')+'</div>'
    + '</div></article>';
}

function panelShops(){
  if(stayStatus() !== 'active') return lockedPanel(ICON.tag, t().shops.title);
  const u = t().shops;
  const cats = Array.from(new Set(SHOPS.map(s=>s.cat)));
  if(state.shopFilter !== 'all' && !cats.includes(state.shopFilter)) state.shopFilter = 'all';
  const list = SHOPS.filter(s => state.shopFilter === 'all' || s.cat === state.shopFilter);
  const filters = cats.length > 1
    ? '<div class="shopfilters">'+['all'].concat(cats).map(c=>'<button type="button" class="shopfilter" data-action="filterShops" data-cat="'+c+'" aria-pressed="'+(state.shopFilter===c)+'">'+(c==='all'?u.all:u.cats[c])+'</button>').join('')+'</div>'
    : '';
  return '<section class="panel"><div class="card">'
    + '<h2>'+ICON.tag+u.title+'</h2>'
    + '<p class="lead">'+u.lead+'</p>'
    + '<div class="passbanner"><span class="pl">'+ICON.check+u.pass+'</span><span class="pd">'+u.today+' '+fmtDate()+'</span><span class="pd" style="flex-basis:100%;">'+t().stay.label+' '+stayRangeText()+'</span></div>'
    + filters
    + '<div class="shoplist">'+list.map(shopCardHtml).join('')+'</div>'
    + '<p class="shopfoot">'+u.foot+'</p>'
    + '</div></section>';
}

let couponTimer = null;
function renderCoupon(){
  const root = document.getElementById('couponRoot');
  if(state.coupon && stayStatus() !== 'active') state.coupon = null;
  const s = SHOPS.find(x => x.id === state.coupon);
  if(!s){
    root.innerHTML = '';
    document.body.style.overflow = '';
    if(couponTimer){ clearInterval(couponTimer); couponTimer = null; }
    return;
  }
  const u = t().shops;
  root.innerHTML = '<div class="coupon" role="dialog" aria-modal="true">'
    + '<div class="coupon-bar"></div>'
    + '<button type="button" class="btn ghost coupon-close" data-action="closeCoupon">'+u.close+'</button>'
    + '<div class="coupon-pass">'+ICON.check+u.pass+'</div>'
    + '<div class="coupon-date disp">'+fmtDate()+'</div>'
    + '<div class="coupon-time" id="couponClock">'+fmtTime()+'</div>'
    + '<div class="coupon-stay">'+t().stay.label+' '+stayRangeText()+'</div>'
    + '<div class="card coupon-card"><h2 class="coupon-shop disp">'+L(s.name)+'</h2><div class="offerbox">'+offerHtml(s)+'</div></div>'
    + '<p class="coupon-hint">'+u.showHint+'</p>'
    + '</div>';
  document.body.style.overflow = 'hidden';
  if(!couponTimer){
    couponTimer = setInterval(function(){
      const el = document.getElementById('couponClock');
      if(el) el.textContent = fmtTime();
    }, 1000);
  }
}

function wifiRowHtml(ap, idx){
  const id = 'wf-'+state.room+'-'+idx;
  return '<div class="wifirow">'
    + '<div><div class="wlabel">'+(ap.label[state.lang]||ap.label.ja)+' &middot; SSID '+ap.ssid+'</div>'
    + '<div class="wval" id="'+id+'" data-masked="1" data-value="'+ap.pass+'">••••••••••••</div></div>'
    + '<div class="wactions">'
      + '<button type="button" class="iconbtn" id="'+id+'-btn" data-action="toggleMask" data-target="'+id+'">'+ICON.eye+'<span>'+t().wifi.show+'</span></button>'
      + '<button type="button" class="iconbtn" data-action="copy" data-value="'+ap.pass+'">'+ICON.copy+'<span>'+t().wifi.copy+'</span></button>'
    + '</div></div>';
}
function panelWifi(){
  if(stayStatus() !== 'active') return lockedPanel(ICON.wifi, t().wifi.title);
  const w = t().wifi;
  let body;
  if(!state.room){
    body = '<div class="faq-empty">'+ICON.wifi+'<div>'+w.selectPrompt+'</div>'
      + '<div class="roomgrid" style="margin-top:16px;text-align:left;">'+['102','201','202'].map(roomCardHtml).join('')+'</div></div>';
  } else {
    const conf = WIFI[state.room];
    body = '<div class="wifiblock"><h3>'+t().rooms[state.room].name+'</h3>'
      + conf.aps.map(wifiRowHtml).join('') + '</div>'
      + '<div class="wifiblock"><h3>'+w.extraTitle+'</h3>'
      + wifiRowHtml(WIFI_EXTRA, 'x') + '</div>';
  }
  return '<section class="panel"><div class="card">'
    + '<h2>'+ICON.wifi+w.title+'</h2>'
    + '<p class="lead">'+w.lead+'</p>'
    + body
    + '</div></section>';
}

function panelFaq(){
  const f = t().faq;
  const q = state.faqQuery.trim().toLowerCase();
  const items = f.items.filter(it => !q || (it.q+' '+it.a).toLowerCase().includes(q));
  return '<section class="panel"><div class="card">'
    + '<h2>'+ICON.faq+f.title+'</h2>'
    + '<p class="lead">'+f.lead+'</p>'
    + '<div class="searchbox">'+ICON.search+'<input type="text" id="faqSearchInput" placeholder="'+f.searchPh+'" value="'+state.faqQuery.replace(/"/g,'&quot;')+'"></div>'
    + '<div id="faqlist">'
    + (items.length ? items.map(it=>'<details class="faqitem"><summary>'+it.q+ICON.chev+'</summary><div class="faqans">'+it.a+'</div></details>').join('')
      : '<div class="faq-empty">'+ICON.faq+'<div>'+f.empty+'</div><div class="ctarow" style="justify-content:center;"><button class="btn primary" data-action="setTab" data-tab="contact">'+ICON.mail+f.askOwner+'</button></div></div>')
    + '</div></div></section>';
}

function panelContact(){
  const c = t().contact;
  const subject = encodeURIComponent('さつきあん / Satsukian — Question');
  return '<section class="panel"><div class="card contactcard">'
    + '<h2>'+ICON.mail+c.title+'</h2>'
    + '<p class="lead" style="margin-bottom:2px;">'+c.lead+'</p>'
    + '<div class="contactrow">'+ICON.mail+'<div><div class="clabel">'+c.emailLabel+'</div><div class="cval">'+EMAIL+'</div></div></div>'
    + '<div class="contactrow">'+ICON.phone+'<div><div class="clabel">'+c.phoneLabel+'</div><div class="cval"><a class="phone-link" href="tel:'+PHONE_MAIN.replace(/-/g,'')+'">'+PHONE_MAIN+'</a></div></div></div>'
    + '<div class="ctarow"><a class="btn primary" href="mailto:'+EMAIL+'?subject='+subject+'">'+ICON.mail+c.emailBtn+'</a></div>'
    + '<div class="emerg-box">'+ICON.pin+'<div><strong>'+c.emergencyLabel+'</strong><br>'+c.emergencyNote+'<br><strong style="font-size:15px;"><a class="phone-link" href="tel:'+PHONE_EMG.replace(/-/g,'')+'">'+PHONE_EMG+'</a></strong></div></div>'
    + '</div></section>';
}

function renderContent(){
  if(!state.languageSelected){
    document.getElementById('content').innerHTML = panelLanguage();
    return;
  }
  if(!state.stay || state.editingStay){
    document.getElementById('content').innerHTML = panelStay();
    return;
  }
  if(!state.consentAccepted){
    document.getElementById('content').innerHTML = panelConsent();
    return;
  }
  const map = { guide: panelGuide, rules: panelRules, bbq: panelBbq, wifi: panelWifi, shops: panelShops, faq: panelFaq, contact: panelContact };
  document.getElementById('content').innerHTML = map[state.tab]();
}

function render(){
  document.body.setAttribute('data-lang', state.lang);
  document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : state.lang;
  document.querySelector('nav.tabs').hidden = !guideVisible();
  document.getElementById('eyebrow').textContent = state.languageSelected ? t().eyebrow : 'Language / 言語 / 語言 / 언어';
  document.getElementById('tagline').textContent = state.languageSelected ? t().tagline : '';
  const heroPhoto = document.getElementById('heroPhoto');
  if(!heroPhoto.getAttribute('src')) heroPhoto.src = GUIDE_PHOTOS.exterior;
  heroPhoto.alt = t().photos.exteriorAlt;
  renderLangbar();
  renderRoombar();
  renderTabbar();
  renderContent();
  renderCoupon();
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && !state.editingStay) render();
});
render();
</script>
</body>
</html>
